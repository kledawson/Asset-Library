#workshop-help-design .wh-mini {display:none;position:absolute;top:22px;left:22px;background:#fff5e3;border-radius:16px;padding:18px;width:200px;font-size:13px;box-shadow:0 12px 35px #57452f15}

#workshop-help-design .wh-grid {display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}

<script>
(()=>{

{title:'Asset Library',icon:'library',rows:[
[['↑','↓'],'Previous / next asset','Stops at the ends.'],
[['←','→'],'Previous / next version tab','Colors, quality versions, and All; no wrapping.'],
[['PgUp','PgDn'],'Previous / next package','Stops at the first and last package.'],

[['Asset'],'Choose an asset','Parcels remember their last tab.'],

{title:'Camera & rotation',icon:'orbit',rows:[

[['Scroll'],'Zoom in / out','Use the mouse wheel.'],
[['Right drag'],'Pan the camera','Hold the right mouse button and drag.'],
[['Ring drag'],'Rotate the asset','The gray ring rotates the model, not the camera.'],
[['↶','↷'],'Rotate left / right','Buttons beside the asset label.'],
[['Reset view'],'Restore the preview','Resets camera, rotation, and drop state; keeps model edits.']]},
{title:'Preview Settings',icon:'sliders-horizontal',rows:[
[['Drop test'],'Raise and drop the prop','One individual version, with the editor closed.'],
[['Reset prop'],'Return to its starting pose','Freezes the prop in its original preview position.'],
[['Labels'],'Show / hide labels','Toggles labels and their rotation buttons.'],
[['Open GLB'],'Preview a local model','Adds an Imported Models package; does not replace library assets.']]},
{title:'Model Editor · selection',icon:'mouse-pointer-2',rows:[
[['Edit Model'],'Open / close editing','Choose one editable version; rack comparisons remain read-only.'],
[['Item'],'Select a whole object','Moves the grouped object together.'],
[['Element'],'Select a single part','Uses an orange highlight; Item uses teal.'],
[['Click'],'Select in the chosen mode','A brief delay keeps double-click navigation separate.'],
[['Click outside'],'Clear the selection','Click empty space outside the object.'],
[['Esc'],'Deselect','Clears the selected part or item.'],
[['Filter / list'],'Find and select a part','Search names, then choose a part from the dropdown.']]},
{title:'Move, rotate & resize',icon:'move-3d',rows:[
[['W'],'Move','Drag the colored axis handles.'],
[['E'],'Rotate','Drag the rotation handles.'],
[['R'],'Resize','Drag the scale handles.'],
[['X / Y / Z'],'Precise adjustments','For a selected element: position, rotation in degrees, and size.'],
[['Duplicate'],'Duplicate Selected','Available in Element mode; also Ctrl+B.'],
[['Remove'],'Remove Selected','Available in Element mode.'],
[['Reset Part'],'Restore the part transform','Returns position, rotation, and size to the saved/source values.']]},

[['Ctrl','C'],'Copy a selected element','Editor selection required.'],
[['Ctrl','V'],'Paste as a duplicate','Within the same asset version.'],
[['Ctrl','B'],'Duplicate a selected element','Uses the current element.']]}];
const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
